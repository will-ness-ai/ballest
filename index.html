<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballest of Them All — Campaign Leaderboards</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#242c39;
    --text:#e6edf3; --dim:#8b98a9; --accent:#ffb638; --accent2:#57b6ff;
    --gold:#ffcf40; --silver:#c7d0da; --bronze:#e08a4b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 20px 10px;max-width:1000px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.2px}
  h1 .ball{display:inline-block;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,var(--accent) 60%,#a06b00);
    vertical-align:-1px;margin-right:8px}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;font-size:14px}
  input{flex:1;min-width:160px}
  .groups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;font-size:13px;user-select:none}
  .chip.active{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .meta{color:var(--dim);font-size:13px;margin:2px 0 14px}
  /* NOTE: no overflow:hidden here — on a very tall table it triggers a Chromium
     paint bug (content goes blank on scroll). Corners are rounded per-cell instead. */
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
    border:1px solid var(--line);border-radius:12px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  thead th:first-child{border-top-left-radius:12px}
  thead th:last-child{border-top-right-radius:12px}
  tbody tr:last-child td:first-child{border-bottom-left-radius:12px}
  tbody tr:last-child td:last-child{border-bottom-right-radius:12px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1a2130}
  .rank{width:56px;font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
  .rank.m1{color:var(--gold)} .rank.m2{color:var(--silver)} .rank.m3{color:var(--bronze)}
  .player{display:flex;align-items:center;gap:10px}
  .player img{width:26px;height:26px;border-radius:6px;background:var(--panel2)}
  .player a{color:var(--text);text-decoration:none}
  .player a:hover{color:var(--accent2)}
  .time{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .val{font-variant-numeric:tabular-nums;color:var(--accent2);text-align:right}
  th.num,td.num{text-align:right}
  .note{background:#20180a;border:1px solid #3a2c10;color:#e8c98a;padding:8px 12px;
    border-radius:8px;font-size:12.5px;margin:10px 0}
  .empty{color:var(--dim);padding:30px;text-align:center}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0;color:var(--dim);font-size:13px}
  .pager button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 14px;cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  footer{max-width:1000px;margin:0 auto;padding:0 20px 40px;color:var(--dim);font-size:12px}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1><span class="ball"></span>Ballest of Them All — Campaign Leaderboards</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<div class="wrap">
  <div class="groups" id="groups"></div>
  <div class="toolbar">
    <select id="board"></select>
    <input id="search" placeholder="Filter players…">
  </div>
  <div class="meta" id="boardmeta"></div>
  <div id="note"></div>
  <div id="tablewrap"></div>
</div>
<footer id="footer"></footer>

<script>
let DATA=null, curGroup="all", curBoard=null, curPage=1;
const PAGE_SIZE=25;

function scoreType(name){
  if(name.startsWith("Overall")) return "points";     // aggregate points, higher better
  if(name==="Map_TheTower") return "tower";           // suspect / experimental
  return "time";                                       // per-track: ms, lower better
}
function fmtMs(ms){
  ms=Math.abs(+ms); const h=Math.floor(ms/3600000);
  const m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), x=ms%1000;
  const mm=String(m).padStart(h?2:1,'0'), ss=String(s).padStart(2,'0'), xx=String(x).padStart(3,'0');
  return (h?h+":":"")+mm+":"+ss+"."+xx;
}

function render(){
  const b=DATA.boards.find(x=>x.name===curBoard); if(!b) return;
  const st=scoreType(b.name);
  document.getElementById('boardmeta').textContent =
    `${b.entry_count.toLocaleString()} players on this board · showing top ${b.rows.length}`;
  const note=document.getElementById('note');
  note.innerHTML = st==="tower"
    ? `<div class="note">⚠ This board (<code>Map_TheTower</code>) returns unusual values and only ${b.rows.length} entries — likely an internal/legacy metric, not clean run times. Treat as experimental.</div>`
    : (st==="points"
      ? `<div class="note">This is an aggregate <b>points</b> board (higher is better), not a single-run time.</div>` : "");

  const q=document.getElementById('search').value.trim().toLowerCase();
  const all=b.rows.filter(r=>!q || (r.persona||"").toLowerCase().includes(q) || r.steam_id.includes(q));
  const pages=Math.max(1, Math.ceil(all.length/PAGE_SIZE));
  if(curPage>pages) curPage=pages;
  if(curPage<1) curPage=1;
  const rows=all.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  const head = st==="points"
    ? `<th class="rank">#</th><th>Player</th><th class="num">Points</th>`
    : `<th class="rank">#</th><th>Player</th><th class="num">Time</th>`;
  let body="";
  for(const r of rows){
    const m=r.rank<=3?`m${r.rank}`:"";
    const av=r.avatar?`<img src="${r.avatar}" alt="">`:`<img alt="">`;
    const nm=r.persona||("("+r.steam_id+")");
    const link=r.profileurl?`<a href="${r.profileurl}" target="_blank" rel="noopener">${escapeHtml(nm)}</a>`:escapeHtml(nm);
    const val = st==="points" ? `<td class="val">${(+r.score_ms).toLocaleString()}</td>`
                              : `<td class="time">${fmtMs(r.score_ms)}</td>`;
    body+=`<tr><td class="rank ${m}">${r.rank}</td><td><div class="player">${av}${link}</div></td>${val}</tr>`;
  }
  const pager = all.length>PAGE_SIZE ? `<div class="pager">
      <button onclick="gotoPage(${curPage-1})" ${curPage<=1?'disabled':''}>‹ Prev</button>
      <span>ranks ${(curPage-1)*PAGE_SIZE+1}–${Math.min(curPage*PAGE_SIZE, all.length)} of ${all.length}</span>
      <button onclick="gotoPage(${curPage+1})" ${curPage>=pages?'disabled':''}>Next ›</button>
    </div>` : "";
  document.getElementById('tablewrap').innerHTML = rows.length
    ? `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${pager}`
    : `<div class="empty">No players match “${escapeHtml(q)}”.</div>`;
}
function gotoPage(n){ curPage=n; render(); window.scrollTo({top:0}); }
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function activeBoards(){ return DATA.boards.filter(b=>b.group!=="Trials"); }

function buildBoardSelect(){
  const sel=document.getElementById('board'); sel.innerHTML="";
  const boards=activeBoards().filter(b=>b.group===curGroup);
  for(const b of boards){
    const o=document.createElement('option'); o.value=b.name; o.textContent=b.display; sel.appendChild(o);
  }
  if(!boards.find(b=>b.name===curBoard)) curBoard=boards[0]?.name;
  sel.value=curBoard;
}
function buildGroups(){
  const groups=[...new Set(activeBoards().map(b=>b.group))];
  const el=document.getElementById('groups'); el.innerHTML="";
  for(const g of groups){
    const c=document.createElement('div'); c.className="chip"+(g===curGroup?" active":"");
    c.textContent=g; c.onclick=()=>{curGroup=g;curPage=1;buildGroups();buildBoardSelect();render();};
    el.appendChild(c);
  }
}

fetch('data/campaign.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const boards=activeBoards();
  const players=new Set(); boards.forEach(b=>b.rows.forEach(r=>players.add(r.steam_id)));
  const dt=new Date(d.generated_at);
  document.getElementById('sub').textContent =
    `${boards.length} boards · ${players.size} players · updated ${dt.toLocaleString()}`;
  curGroup = boards.find(b=>b.group==="Season 2") ? "Season 2" : boards[0].group;
  curBoard = (boards.find(b=>b.name==="OverallLeaderboard_EASeason2") || boards[0]).name;
  buildGroups(); buildBoardSelect(); render();
  document.getElementById('board').onchange=e=>{curBoard=e.target.value;curPage=1;render();};
  document.getElementById('search').oninput=()=>{curPage=1;render();};
  document.getElementById('footer').innerHTML =
    `Data read from Steam leaderboards for appid 3339810 · fan project, not affiliated with Low5ive.`;
}).catch(e=>{
  document.getElementById('sub').textContent="Failed to load data/campaign.json — run the collector first.";
});
</script>
</body>
</html>
