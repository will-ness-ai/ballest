<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballest of Them All — Campaign Leaderboards</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#242c39;
    --text:#e6edf3; --dim:#8b98a9; --accent:#ffb638; --accent2:#57b6ff;
    --gold:#ffcf40; --silver:#c7d0da; --bronze:#e08a4b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 20px 10px;max-width:1000px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.2px}
  h1 .ball{display:inline-block;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,var(--accent) 60%,#a06b00);
    vertical-align:-1px;margin-right:8px}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .dim{color:var(--dim)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;font-size:14px}
  input{flex:1;min-width:160px}
  .groups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;font-size:13px;user-select:none}
  .chip.active{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .meta{color:var(--dim);font-size:13px;margin:2px 0 14px}
  /* corners rounded per-cell (no overflow:hidden on a tall table — that trips a
     Chromium paint bug on very long pages). */
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
    border:1px solid var(--line);border-radius:12px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--dim);font-size:12px;text-transform:uppercase;
    letter-spacing:.5px;position:sticky;top:0;z-index:1}
  thead th:first-child{border-top-left-radius:12px}
  thead th:last-child{border-top-right-radius:12px}
  tbody tr:last-child td{border-bottom:none}
  tr:hover td{background:#1a2130}
  .rank{width:56px;font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
  .rank.m1{color:var(--gold)} .rank.m2{color:var(--silver)} .rank.m3{color:var(--bronze)}
  .player{display:flex;align-items:center;gap:10px}
  .player img{width:26px;height:26px;border-radius:6px;background:var(--panel2)}
  .player a{color:var(--text);text-decoration:none}
  .player a:hover{color:var(--accent2)}
  .time{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .val{font-variant-numeric:tabular-nums;color:var(--accent2);text-align:right}
  th.num,td.num{text-align:right}
  .note{background:#20180a;border:1px solid #3a2c10;color:#e8c98a;padding:8px 12px;
    border-radius:8px;font-size:12.5px;margin:10px 0}
  .empty{color:var(--dim);padding:30px;text-align:center}
  .loading{color:var(--dim);text-align:center;padding:14px;font-size:13px}
  footer{max-width:1000px;margin:0 auto;padding:0 20px 40px;color:var(--dim);font-size:12px}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1><span class="ball"></span>Ballest of Them All — Campaign Leaderboards</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<div class="wrap">
  <div class="groups" id="groups"></div>
  <div class="toolbar">
    <select id="board"></select>
    <input id="search" placeholder="Filter players…">
  </div>
  <div class="meta" id="boardmeta"></div>
  <div id="note"></div>
  <div id="tablewrap"></div>
</div>
<footer id="footer"></footer>

<script>
let INDEX=null, curGroup="all", curBoard=null;
const BOARD_CACHE={};
let curBoardData=null, curRows=[], shown=0;
const CHUNK=50;

function scoreType(name){
  if(name.startsWith("Overall")) return "points";     // aggregate points, higher better
  if(name==="Map_TheTower") return "tower";           // suspect / experimental
  return "time";                                       // per-track: ms, lower better
}
function fmtMs(ms){
  ms=Math.abs(+ms); const h=Math.floor(ms/3600000);
  const m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), x=ms%1000;
  const mm=String(m).padStart(h?2:1,'0'), ss=String(s).padStart(2,'0'), xx=String(x).padStart(3,'0');
  return (h?h+":":"")+mm+":"+ss+"."+xx;
}
function relTime(dt){
  const s=Math.round((Date.now()-dt.getTime())/1000);
  if(s<60) return "just now";
  const m=Math.round(s/60); if(m<60) return m+(m===1?" min ago":" mins ago");
  const h=Math.round(m/60); if(h<24) return h+(h===1?" hour ago":" hours ago");
  const d=Math.round(h/24); return d+(d===1?" day ago":" days ago");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function activeBoards(){ return INDEX.boards.filter(b=>b.group!=="Trials"); }

function rowHtml(r, st){
  const m=r.rank<=3?`m${r.rank}`:"";
  const av=r.avatar?`<img src="${r.avatar}" alt="" loading="lazy">`:`<img alt="">`;
  const nm=r.persona||("("+r.steam_id+")");
  const link=r.profileurl?`<a href="${r.profileurl}" target="_blank" rel="noopener">${escapeHtml(nm)}</a>`:escapeHtml(nm);
  const val = st==="points" ? `<td class="val">${(+r.score_ms).toLocaleString()}</td>`
                            : `<td class="time">${fmtMs(r.score_ms)}</td>`;
  return `<tr><td class="rank ${m}">${r.rank}</td><td><div class="player">${av}${link}</div></td>${val}</tr>`;
}

function showNote(b){
  const st=scoreType(b.name);
  document.getElementById('note').innerHTML = st==="tower"
    ? `<div class="note">⚠ This board (<code>Map_TheTower</code>) returns unusual values and very few entries — likely an internal/legacy metric, not clean run times.</div>`
    : (st==="points"
      ? `<div class="note">This is an aggregate <b>points</b> board (higher is better), not a single-run time.</div>` : "");
}
function updateMeta(){
  const b=curBoardData;
  document.getElementById('boardmeta').textContent =
    `${b.entry_count.toLocaleString()} players on this board · showing ${shown.toLocaleString()} of ${curRows.length.toLocaleString()}`;
}

function renderMore(){
  const tbody=document.getElementById('tbody'); if(!tbody) return;
  if(shown>=curRows.length) return;
  const st=scoreType(curBoard);
  const end=Math.min(shown+CHUNK, curRows.length);
  let html="";
  for(let i=shown;i<end;i++) html+=rowHtml(curRows[i], st);
  tbody.insertAdjacentHTML('beforeend', html);
  shown=end;
  updateMeta();
}
// Keep loading until the content overflows the viewport (so there's always
// something to scroll to), guarded against runaway loops.
function fillViewport(){
  let guard=0;
  while(shown<curRows.length &&
        document.documentElement.scrollHeight <= window.innerHeight+800 && guard<500){
    renderMore(); guard++;
  }
}
function onScroll(){
  if(!curRows.length || shown>=curRows.length) return;
  if(window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-800) renderMore();
}
function buildTable(){
  const tw=document.getElementById('tablewrap');
  if(!curRows.length){ tw.innerHTML=`<div class="empty">No players match your search.</div>`; return; }
  const st=scoreType(curBoard);
  const head = st==="points"
    ? `<th class="rank">#</th><th>Player</th><th class="num">Points</th>`
    : `<th class="rank">#</th><th>Player</th><th class="num">Time</th>`;
  tw.innerHTML =
    `<table><thead><tr>${head}</tr></thead><tbody id="tbody"></tbody></table>`;
  shown=0;
  renderMore();
  fillViewport();
}
function applyFilterAndRender(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  curRows = !q ? curBoardData.rows
    : curBoardData.rows.filter(r=>(r.persona||"").toLowerCase().includes(q) || r.steam_id.includes(q));
  buildTable();
}

async function loadBoard(name){
  if(BOARD_CACHE[name]) return BOARD_CACHE[name];
  const meta=INDEX.boards.find(b=>b.name===name);
  const res=await fetch('data/'+meta.file);
  if(!res.ok) throw new Error('fetch '+meta.file+' -> '+res.status);
  const data=await res.json();
  BOARD_CACHE[name]=data;
  return data;
}
async function selectBoard(name){
  curBoard=name;
  document.getElementById('board').value=name;
  document.getElementById('note').innerHTML="";
  document.getElementById('boardmeta').textContent="";
  document.getElementById('tablewrap').innerHTML=`<div class="loading">Loading leaderboard…</div>`;
  let data;
  try { data=await loadBoard(name); }
  catch(e){ document.getElementById('tablewrap').innerHTML=`<div class="empty">Couldn’t load this board.</div>`; return; }
  if(curBoard!==name) return;   // user switched while it was loading
  curBoardData=data;
  showNote(data);
  applyFilterAndRender();
}

function buildBoardSelect(){
  const sel=document.getElementById('board'); sel.innerHTML="";
  const boards=activeBoards().filter(b=>b.group===curGroup);
  for(const b of boards){
    const o=document.createElement('option'); o.value=b.name; o.textContent=b.display; sel.appendChild(o);
  }
  if(!boards.find(b=>b.name===curBoard)) curBoard=boards[0]?.name;
  sel.value=curBoard;
}
function buildGroups(){
  const groups=[...new Set(activeBoards().map(b=>b.group))];
  const el=document.getElementById('groups'); el.innerHTML="";
  for(const g of groups){
    const c=document.createElement('div'); c.className="chip"+(g===curGroup?" active":"");
    c.textContent=g; c.onclick=()=>{ curGroup=g; buildGroups(); buildBoardSelect(); selectBoard(curBoard); };
    el.appendChild(c);
  }
}

fetch('data/index.json').then(r=>r.json()).then(idx=>{
  INDEX=idx;
  const boards=activeBoards();
  const dt=new Date(idx.generated_at);
  document.getElementById('sub').innerHTML =
    `${boards.length} boards · ${idx.player_count.toLocaleString()} players · last refreshed ` +
    `<span title="${dt.toLocaleString()}">${relTime(dt)}</span> <span class="dim">(${dt.toLocaleString()})</span>`;
  curGroup = boards.find(b=>b.group==="Season 2") ? "Season 2" : boards[0].group;
  curBoard = (boards.find(b=>b.name==="OverallLeaderboard_EASeason2") || boards[0]).name;
  buildGroups(); buildBoardSelect(); selectBoard(curBoard);
  document.getElementById('board').onchange=e=>selectBoard(e.target.value);
  document.getElementById('search').oninput=()=>{ if(curBoardData) applyFilterAndRender(); };
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', ()=>{ onScroll(); fillViewport(); });
  document.getElementById('footer').innerHTML =
    `Data read from Steam leaderboards for appid 3339810 · fan project, not affiliated with the developer.`;
}).catch(e=>{
  document.getElementById('sub').textContent="Failed to load data/index.json — run the collector first.";
});
</script>
</body>
</html>
