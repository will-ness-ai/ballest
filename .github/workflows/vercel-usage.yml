name: Vercel usage

# Warns the private ops channel when the Vercel team's last 30 days near a Hobby limit
# (tools/vercel_usage.py). Quiet otherwise; run it by hand to post the numbers anyway.

on:
  schedule:
    - cron: "30 14 * * *" # daily, 14:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/vercel_usage.py ${{ github.event_name == 'workflow_dispatch' && '--always' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
