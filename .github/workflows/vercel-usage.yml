name: Vercel usage

# Reports the Vercel team's plan and usage to the private ops channel (tools/vercel_usage.py):
# on Mondays, and whenever something nears a limit. Run it by hand to post the numbers anyway.

on:
  schedule:
    - cron: "30 14 * * *" # daily, 14:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/vercel_usage.py ${{ github.event_name == 'workflow_dispatch' && '--always' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
