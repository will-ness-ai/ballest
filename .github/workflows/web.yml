name: Build web

# Builds the Next.js app in web/ that Vercel serves (ADR 0004), starts it, and
# requests everything the pages load (scripts/smoke.mjs), so a site file missing
# from SITE in scripts/sync-site.mjs fails here rather than 404ing in production.
# The paths are the ones web/vercel.json's ignoreCommand deploys on.

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - "index.html"
      - "favicon.ico"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "og.png"
      - "data/**"
      - "circuit/**"
      - "leth/**"
      - "multiballs/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # The tests and the build's migrate step each get a throwaway Postgres (docs/adr/0005).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Smoke-test the build
        run: |
          pnpm start -p 3000 &
          for i in $(seq 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          pnpm smoke http://localhost:3000
