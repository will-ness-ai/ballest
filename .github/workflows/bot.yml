name: Multiballs

# Tests and typechecks the Discord bot on every PR that touches it, and deploys it to Fly.io
# (discord-bot/fly.toml) from main. Worktrees never deploy; only this workflow does. Its one
# secret, FLY_API_TOKEN, is a deploy token scoped to the Fly app; the bot's own secrets live in
# `fly secrets`.

on:
  push:
    branches: [main]
    paths: ["discord-bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["discord-bot/**", ".github/workflows/bot.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: discord-bot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, never cancelled halfway; a queued deploy supersedes an older queued
    # one, which is fine because each deploys the commit that triggered it and main only moves on.
    concurrency:
      group: multiballs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: discord-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
