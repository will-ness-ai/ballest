name: Fly cost

# Posts a weekly Fly.io cost estimate for Multiballs and the collector's service (ADR 0012) to the
# private ops channel (discord-bot/scripts/cost_report.py). Fly has no billing API, so it prices
# what is provisioned. Each app's deploy token reads only its own app.

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays, 15:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: python3 discord-bot/scripts/cost_report.py multiballs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
      - run: python3 discord-bot/scripts/cost_report.py ballest-collector
        if: ${{ !cancelled() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_COLLECTOR_TOKEN }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
