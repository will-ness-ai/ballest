name: Refresh leaderboards

# Reads Steam's boards into the database as one Refresh (tools/steampy_collect.py),
# then asks the site to refetch its cached reads. Nothing is committed: the database
# is the only copy (phase 5 of docs/nextjs-migration.md).
#
# By hand only, as a fallback: the collector's service on Fly runs the Refresh every three
# hours (tools/runner.py, ADR 0012), and asking it is how to run one now
# (`fly ssh console -a ballest-collector -C "python runner.py ask refresh"`). Run this only
# while that service is down: both log into Steam with the same account, and two logins drop
# each other.

on:
  workflow_dispatch: {}

# Don't let two refreshes overlap.
concurrency:
  group: refresh-leaderboards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The database (docs/adr/0005): where the collector reads what it remembers and writes
    # the Refresh. Without it the run fails before logging into Steam.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector deps
        run: python -m pip install -r tools/requirements-steampy.txt

      - name: Collect leaderboards from Steam
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          # the developers' API, which names each Daily's board; this step only, and the
          # collector never prints either (tools/daily.py)
          BALLEST_API_KEY: ${{ secrets.BALLEST_API_KEY }}
          BALLEST_DAILY_URL: ${{ secrets.BALLEST_DAILY_URL }}
          # after the database commit, the collector asks the site to refetch its cached reads
          SITE_URL: https://ballestrecords.com
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python tools/steampy_collect.py
