name: Refresh leaderboards

# Regenerates data/index.json + data/boards/*.json from Steam and commits them.
# GitHub Pages ("Deploy from a branch": main / root) redeploys automatically
# whenever this push lands.

on:
  schedule:
    # Every 3 hours (00:00, 03:00, ... UTC). GitHub may delay scheduled runs by
    # a few minutes under load.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Don't let two refreshes overlap.
concurrency:
  group: refresh-leaderboards
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated JSON back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector deps
        run: python -m pip install -r tools/requirements-steampy.txt

      - name: Collect leaderboards from Steam
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python tools/steampy_collect.py

      - name: Commit updated data if changed
        run: |
          git config user.name  "will-ness-ai"
          git config user.email "n3s.online@gmail.com"
          git add data/index.json data/boards
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh campaign leaderboards ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Rebase-and-retry so an unrelated push to main during the run doesn't
            # fail the cycle. Data files are regenerated, so rebasing is safe.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying..."; sleep 5
            done
          fi
