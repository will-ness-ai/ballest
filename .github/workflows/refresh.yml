name: Refresh leaderboards

# Regenerates data/index.json + data/boards/*.json + data/podiums.json from Steam
# and commits them.
# Its push uses GITHUB_TOKEN, which does not trigger deploy.yml's `push`
# trigger, so the deploy job below calls deploy.yml once the data is on main.

on:
  schedule:
    # Every 3 hours (00:00, 03:00, ... UTC). GitHub may delay scheduled runs by
    # a few minutes under load.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Don't let two refreshes overlap.
concurrency:
  group: refresh-leaderboards
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated JSON back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector deps
        run: python -m pip install -r tools/requirements-steampy.txt

      - name: Collect leaderboards from Steam
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python tools/steampy_collect.py

      - name: Commit updated data if changed
        id: commit
        run: |
          git config user.name  "will-ness-ai"
          git config user.email "n3s.online@gmail.com"
          git add data/index.json data/boards data/podiums.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh campaign leaderboards ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Rebase-and-retry so an unrelated push to main during the run doesn't
            # fail the cycle. Data files are regenerated, so on a conflict ours
            # wins outright. A run that never manages to push must fail loudly:
            # a green run with nothing on main once hid a whole refresh.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                pushed=1; break
              fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed; retrying..."; sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "ERROR: could not push refreshed data after 3 attempts"; exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
