name: Refresh leaderboards

# Regenerates data/campaign.json from Steam and commits it.
# GitHub Pages ("Deploy from a branch": main / root) redeploys automatically
# whenever this push lands.

on:
  schedule:
    # Daily at 09:00 UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Don't let two refreshes overlap.
concurrency:
  group: refresh-leaderboards
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated JSON back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector deps
        run: python -m pip install -r tools/requirements-steampy.txt

      - name: Collect leaderboards from Steam
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python tools/steampy_collect.py

      - name: Commit updated data if changed
        run: |
          git config user.name  "will-ness-ai"
          git config user.email "n3s.online@gmail.com"
          git add data/campaign.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh campaign leaderboards ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
