name: Draw a Map's spinning GIF

# Started by Multiballs when it posts a Daily whose Map has a file (discord-bot/src/dailyPost/,
# spec #268), or by hand with a pfid: opens the Map's 3D view on ballestrecords.com in Chromium,
# turns it one full turn and stores the GIF in map_spins (web/scripts/map-spin.ts), which the bot
# reads and edits into the Daily Post. It reads the site and writes only that one row. A failed
# or timed-out run tells the private ops channel at once, naming the Map; the bot's own note an
# hour after asking stays as the fallback, for a run that never started. Nothing comes from apt:
# its mirrors have stalled for a quarter of an hour (2026-10-23), so Chromium uses the libraries
# the runner's own Chrome brought and ffmpeg is a static build from npm.

on:
  workflow_dispatch:
    inputs:
      pfid:
        description: "The Map's Workshop ID"
        required: true
        type: string

# One drawing of a Map at a time; a second ask waits rather than drawing twice at once.
concurrency:
  group: daily-spin-${{ inputs.pfid }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    runs-on: ubuntu-latest
    # a big Map's drawing has taken 16 minutes; the bot waits an hour
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium
        timeout-minutes: 5
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          command -v ffmpeg && exit 0
          npm install --no-save --prefix "$RUNNER_TEMP/ffmpeg" ffmpeg-static@5.2.0
          echo "$RUNNER_TEMP/ffmpeg/node_modules/ffmpeg-static" >> "$GITHUB_PATH"
      - name: Draw and store the GIF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PFID: ${{ inputs.pfid }}
        run: |
          [[ "$PFID" =~ ^[0-9]+$ ]] || { echo "::error::not a Workshop ID: $PFID"; exit 1; }
          pnpm exec tsx scripts/map-spin.ts "$PFID" --out spin.gif
      - uses: actions/upload-artifact@v4
        with:
          name: spin-${{ inputs.pfid }}
          path: web/spin.gif
          retention-days: 7
      - name: Tell ops the drawing failed
        if: failure() || cancelled()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PFID: ${{ inputs.pfid }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$OPS_WEBHOOK_URL" == https://* ]] || { echo "::warning::OPS_WEBHOOK_URL is not set"; exit 0; }
          # The Map's title from the Workshop, if Steam answers; its ID either way.
          title=$(curl -sf --max-time 20 -d itemcount=1 -d "publishedfileids[0]=$PFID" \
            https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/ \
            | jq -r '.response.publishedfiledetails[0].title // empty' || true)
          jq -n --arg title "${title:-Map $PFID}" --arg pfid "$PFID" --arg run "$RUN_URL" \
            '{content: "daily-spin.yml couldn’t draw the spinning GIF for **\($title)** (<https://steamcommunity.com/sharedfiles/filedetails/?id=\($pfid)>); a Daily Post waiting on it stays without it: \($run)", allowed_mentions: {parse: []}}' \
            | curl -sf --max-time 20 -H "Content-Type: application/json" -d @- "$OPS_WEBHOOK_URL"
