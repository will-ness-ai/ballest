name: Check data and lint

# The committed data has to agree with itself: every board listed, rows aligned
# to rank, and every derived file equal to what derive() makes from those boards.
# refresh.yml writes all of that together so its commits are consistent by
# construction; a human or agent change is where they drift. The drift is not
# always visible on the branch: a branch carrying a derived file merges cleanly
# into a main whose boards have moved on since, and the merge result is wrong
# while neither side was. A pull_request run checks out that merge result, which
# is the only place that mismatch exists. The push run then covers a merge that
# went in before the check did, and costs seconds. No Steam credentials either
# way — that is what check_data.py is for.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pure stdlib, like the collector's shared helpers it imports.
      - name: Check the committed data
        run: python tools/check_data.py

  # The collector's database writer against a throwaway Postgres (tools/tests/), each test
  # on a copy of a database the deploy's own migrations built (web/scripts/migrate.mjs).
  collector-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pnpm --dir web install --frozen-lockfile
          python -m pip install -r tools/requirements-test.txt

      - name: Test the database writer
        run: python -m pytest tools/tests

  # Formatting and lint for every file (docs/linting.md), index.html's script included:
  # it has no build step, so tools/page-check is the only thing that parses it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            discord-bot/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.15.20

      # ESLint types each TS file through its own package, so those need their dependencies too
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir discord-bot install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint
