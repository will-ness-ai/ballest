name: Check the collector and lint

# The collector's database writer against a throwaway Postgres, formatting and lint for every
# file, and each PR commit's identity. No Steam credentials anywhere.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]
  workflow_dispatch: {}

jobs:
  # The collector's database writer against a throwaway Postgres (tools/tests/), each test
  # on a copy of a database the deploy's own migrations built (web/scripts/migrate.mjs).
  collector-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pnpm --dir web install --frozen-lockfile
          python -m pip install -r tools/requirements-test.txt

      - name: Test the database writer
        run: python -m pytest tools/tests

  # Formatting and lint for every file (docs/linting.md).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            discord-bot/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.15.20

      # ESLint types each TS file through its own package, so those need their dependencies too
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir discord-bot install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      # web/.next/types and next-env.d.ts, which a local build leaves behind and the site's
      # tsconfig includes, so lint types the site here as on a machine that has built it
      - name: Generate Next's route types
        run: pnpm --dir web exec next typegen

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  # Every commit a PR adds, as author and committer, is the repo-local identity
  # (CODING_STANDARDS.md, Git), or a merge GitHub made for Will from its web page. Commits main
  # already has are left out, since branches here merge main in.
  authors:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      IDENTITY: n3s.online@gmail.com
      WEB_MERGE: 113004972+will-ness-ai@users.noreply.github.com noreply@github.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit authors
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git log --format='%h %ae %ce' "$HEAD_SHA" --not origin/main)
          offenders=$(echo "$commits" | awk -v id="$IDENTITY" -v web="$WEB_MERGE" \
            'NF && $2 " " $3 != id " " id && $2 " " $3 != web')
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::these commits aren't authored and committed as will-ness-ai <$IDENTITY>; rewrite them on your branch with git commit --amend --reset-author"
            exit 1
          fi
