name: Add a Prefab to the database

# One-off, by hand: inserts one Prefab (a file committed under prefabs/) into the production
# database, credited to the maintainer, for the rare case it can't be uploaded through the
# site in a browser. It runs here because the database is not reachable from cloud agent
# sessions (docs/adr/0005). The insert runs the same checks and addPrefab as the upload API
# (web/scripts/add-prefab.ts) and is idempotent, so a name already taken is left alone.

on:
  workflow_dispatch:
    inputs:
      file:
        description: Path to the Prefab JSON, from the repo root (e.g. prefabs/ball-people.json)
        required: true
      name:
        description: The Prefab's name
        required: true
      tags:
        description: Comma-separated tags (Decoration, Obstacle, Ramp, Loop, Scenery, Structure)
        default: ""
      description:
        description: The description
        default: ""

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PREFAB_FILE: ${{ inputs.file }}
      PREFAB_NAME: ${{ inputs.name }}
      PREFAB_TAGS: ${{ inputs.tags }}
      PREFAB_DESC: ${{ inputs.description }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir web install --frozen-lockfile

      - name: Add the Prefab
        run: pnpm --dir web exec tsx scripts/add-prefab.ts
