name: Add new Workshop Maps

# Started by Multiballs when the game Discord's #new-tracks gets a post (discord-bot/src/newTracks.ts):
# writes the Workshop's newest Maps the database lacks (tools/add_maps.py), so they show on the
# site within minutes, not at the next Refresh (one Steam Web API request a try, no Steam login).
# Their files for the 3D view come with the next Refresh's Map file step: the Refresh runs on Fly
# now (ADR 0012), where this run can't see whether it is logged into Steam. Once Multiballs asks
# the collector's service instead (POST /add-maps, tools/runner.py), which downloads them at once,
# this workflow goes.

on:
  workflow_dispatch: {}

# A Refresh that read the catalogue before the Map was published and commits after this run
# unlists it again until the next one (docs/data.md, "New Maps").
concurrency:
  group: add-maps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install -r tools/requirements-steampy.txt

      - name: Add new Workshop Maps
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SITE_URL: https://ballestrecords.com
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python tools/add_maps.py
