# Multiballs in production. CI deploys it on every push to main that touches discord-bot/
# (.github/workflows/bot.yml). Secrets live in `fly secrets`, never here.
app = "multiballs"
primary_region = "ord"
# The bot shuts down cleanly on SIGTERM (Steam log off, Discord destroy, SQLite closed).
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/multiballs.sqlite"
  PORT = "8080"

# The Discord Activity: Discord's URL Mapping sends the page's requests to multiballs.fly.dev,
# and Fly's proxy passes them to the bot. The bot only listens once DISCORD_CLIENT_SECRET is
# set. The machine is the bot, so the proxy must never stop it for being idle.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# One volume, so one machine: a deploy stops the old copy before starting the new one, and the
# engine's restart recovery picks live Matches back up.
[mounts]
  source = "multiballs_data"
  destination = "/data"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
