<title>Ballest Profiles and Rivals</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: the live site's dark HUD chassis, one 1100px column; prototype chrome floats bottom-right */
:root{
  color-scheme:dark;
  --bg:#0a1020; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.09);
  --solid:#111a2c; --line:rgba(150,175,245,.18); --line2:rgba(255,255,255,.055);
  --text:#eaf0ff; --dim:#93a2c8; --faint:#63719a;
  --accent:#8be03c; --accent-ink:#0d2000; --accent-soft:rgba(139,224,60,.14);
  --wr:#8be03c; --gold:#ffd447; --silver:#d3dcea; --bronze:#ef9a52; --author:#5fd4ff; --none:#3a4566;
  --a:#ff7a8a; --b:#5fd4ff;
  --radius:11px;
  --f-marquee:'Bungee',system-ui,sans-serif;
  --f-hud:'Chakra Petch',system-ui,sans-serif;
  --f-body:'Archivo',system-ui,sans-serif;
  --pk-bg:#f4f1ff; --pk-ink:#1b1740; --pk-dim:#6b6690; --pk-acc:#6c4dff;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 80% -10%, rgba(88,168,255,.16), transparent 62%),
    radial-gradient(680px 460px at 4% 2%, rgba(139,224,60,.10), transparent 64%), var(--bg);
  background-attachment:fixed; padding:0 16px 140px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.site{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
.site .logo{display:flex}
.site .logo i{width:18px;height:18px;border-radius:50%;margin-right:-5px;box-shadow:inset -2px -3px 5px rgba(0,0,0,.35)}
.site b{font:400 20px/1 var(--f-marquee);letter-spacing:.01em}
.site small{display:block;font:600 10.5px/1.4 var(--f-hud);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.back{display:inline-block;font:600 12px var(--f-hud);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-block:14px 10px}
.back:hover{color:var(--text)}
h1,h2,h3{margin:0;text-wrap:balance}
.hud{font-family:var(--f-hud)}
.num{font-family:var(--f-hud);font-variant-numeric:tabular-nums}
.lab{font:600 11px/1.3 var(--f-hud);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.mb{display:inline-block;flex:none;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, hsl(var(--h) 90% 84%), hsl(var(--h) 72% 56%) 45%, hsl(var(--h) 70% 22%) 100%);
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.4)}
.sw{display:block;flex:none;border-radius:7px;
  background:linear-gradient(135deg, hsl(var(--h1) 55% 40%), hsl(var(--h2) 60% 22%)),
  var(--solid);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--ang),rgba(255,255,255,.07) 0 6px,transparent 6px 16px)}
.pid{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pid h1{font:700 30px/1.1 var(--f-body);letter-spacing:-.01em}
.pwho{flex:1;min-width:0}
.pline{color:var(--dim);font-size:14px} .pline b{color:var(--text);font-family:var(--f-hud)}
.steam{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:600 13px var(--f-hud);color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:600 13px var(--f-hud);color:var(--text);background:var(--surface)}
.btn:hover{background:var(--surface2)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-block:18px}
.stat{padding:12px 14px}
.stat dd{margin:4px 0 0;font:700 24px/1.1 var(--f-hud);font-variant-numeric:tabular-nums}
.stat dd small{display:block;font:400 12px/1.4 var(--f-body);color:var(--dim);margin-top:4px}
.sec{margin-block:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechead h2{font:700 19px/1.2 var(--f-body)}
.sechead .lab{color:var(--faint)}
/* circuit, compact */
.season{padding:12px 14px;margin-bottom:10px}
.season .sh{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.season .sh b{font:700 15px var(--f-body)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.ctile{padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.025);font-size:12px}
.ctile .n{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ctile .r{font:700 16px var(--f-hud)} .ctile .r small{font-weight:500;color:var(--faint);font-size:11px}
.ctile[data-m="1"]{border-color:rgba(255,212,71,.5);background:rgba(255,212,71,.08)}
.ctile[data-m="2"]{border-color:rgba(211,220,234,.4)} .ctile[data-m="3"]{border-color:rgba(239,154,82,.45)}
sup{font-size:.6em;margin-left:1px}
/* medal pips and bars */
.pip{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;background:var(--none)}
.t-wr{background:var(--wr)} .c-wr{color:var(--wr)} .t-none{background:var(--none)} .t-author{background:var(--author)} .t-gold{background:var(--gold)} .t-silver{background:var(--silver)} .t-bronze{background:var(--bronze)}
.c-author{color:var(--author)} .c-gold{color:var(--gold)} .c-silver{color:var(--silver)} .c-bronze{color:var(--bronze)} .c-none{color:var(--faint)}
.mbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--none)}
.mbar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font:600 12.5px var(--f-hud);color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:rgba(139,224,60,.4)}
.chip small{opacity:.7;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;font:600 12.5px var(--f-hud);color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
select.sel{background:var(--solid);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 13px var(--f-hud)}
input.search{background:var(--solid);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:220px;max-width:100%}
/* workshop run row */
.wlist{display:grid;gap:4px}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) 88px 104px 20px;align-items:center;gap:12px;padding:7px 10px;border-radius:9px;border:1px solid transparent}
.wrow:hover{background:var(--surface);border-color:var(--line2)}
.wrow .sw{width:44px;height:28px}
.wt{min-width:0} .wt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small{color:var(--faint);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrk{font:700 17px var(--f-hud);text-align:right;font-variant-numeric:tabular-nums} .wrk small{font-size:11px;color:var(--faint);font-weight:500}
.wrk[data-m="1"]{color:var(--gold)} .wrk[data-m="2"]{color:var(--silver)} .wrk[data-m="3"]{color:var(--bronze)}
.wtm{text-align:right;font:500 13.5px var(--f-hud);font-variant-numeric:tabular-nums}
.wtm small{display:block;color:var(--faint);font-size:11.5px}
.more{margin-top:10px}
/* map cards (made) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.mcard .sw{width:100%;aspect-ratio:16/8;border-radius:0;max-width:100%}
.mcard .body{padding:10px 12px;display:grid;gap:4px;font-size:13px}
.mcard .body b{font-size:14.5px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,230px);gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.scard{padding:10px 12px;display:grid;gap:6px;font-size:13px}
.scard .top{display:flex;gap:10px;align-items:center;min-width:0}
.scard .top .sw{width:52px;height:34px}
.scard .top b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .top div{min-width:0}
.scard .big{font:700 20px var(--f-hud)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:20px 18px;overflow-x:auto}
.tabs button{padding:10px 14px;font:600 14px var(--f-hud);color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.tabs button small{color:var(--faint);margin-left:6px}
/* mosaic */
.mosaic{display:flex;flex-wrap:wrap;gap:3px}
.mosaic button{width:15px;height:15px;border-radius:3px}
.mosaic button[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:1px}
.tierline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tierline div{padding:10px 12px}
.tierline b{display:block;font:700 26px/1.1 var(--f-hud)}
.tierline.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.medal{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;position:relative;margin-top:12px;
  box-shadow:inset -3px -4px 6px rgba(0,0,0,.3), inset 2px 2px 4px rgba(255,255,255,.35)}
.medal::before{content:"";position:absolute;top:-13px;left:50%;width:20px;height:18px;transform:translateX(-50%);z-index:-1;
  background:linear-gradient(90deg,#c9485a 50%,#4a6fd0 50%);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
.medal.none{background:transparent;border:2px dashed var(--none);box-shadow:none}
.medal.none::before{background:var(--none)}
.medal.wr{background:var(--wr);color:var(--accent-ink);font:400 18px var(--f-marquee)}
.medal.wr::before{background:linear-gradient(90deg,var(--gold) 50%,#e0b020 50%)}
.trophies{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:12px 8px}
.trophies button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:9px;border:1px solid transparent;isolation:isolate}
.trophies button:hover{background:var(--surface)}
.trophies b{font-size:24px;line-height:1.1}
.trophies [data-zero]{opacity:.4}
.ladder{display:grid;grid-template-columns:120px minmax(0,1fr) 56px 170px;gap:12px;align-items:center;width:100%;padding:7px 8px;border-radius:8px;border:1px solid transparent;text-align:left}
.ladder:hover{background:var(--surface)}
.ladder b{text-align:right;font-size:17px}
.medal.mini{margin:0;flex:none;box-shadow:inset -1px -2px 3px rgba(0,0,0,.3)}
.medal.mini::before{display:none}
.medal.mini.wr{font-size:calc(var(--s) * .55)}
.medal.mini.none{border-width:1.5px}
.wtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.wtile{display:block;border:1px solid var(--line2);border-radius:9px;background:rgba(255,255,255,.025);overflow:hidden}
.wtile:hover{border-color:var(--line)}
.wtile[data-m="1"]{border-color:rgba(139,224,60,.5)} .wtile[data-m="2"]{border-color:rgba(211,220,234,.4)} .wtile[data-m="3"]{border-color:rgba(239,154,82,.45)}
.wtile .in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px 10px;align-items:center}
.wtile .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtile .rk{font:700 19px var(--f-hud)} .wtile .rk small{font-size:11px;color:var(--faint);font-weight:500}
.wtile .gp,.wtile .pc{text-align:right;font:500 12px var(--f-hud);color:var(--dim)}
.wtile .tmm{font:500 12px var(--f-hud);color:var(--faint)}
.pt-bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line2);margin-top:4px;overflow:hidden}
.pt-bar i{display:block;height:100%;background:var(--accent)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{overflow:hidden;display:flex;flex-direction:column}
.pcard .pic{position:relative;aspect-ratio:16/9;max-width:100%;display:block}
.pcard .ov{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(10,16,32,.78);padding:4px 10px 4px 4px;border-radius:999px}
.pcard .ov b{font-size:15px} .pcard .ov small{color:var(--dim);font-weight:500}
.pcard .body{padding:10px 12px;display:grid;gap:2px;font-size:13px}
.pcard .body b{font-size:14.5px}
.grp{margin-bottom:16px}
.grph{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.grph b{font:700 15px var(--f-hud)}
.rival{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:9px;text-align:left}
.rival:hover{background:var(--surface2)}
.rival .rn{flex:1;min-width:0} .rival .rn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival .rn small{color:var(--faint);font-size:12px}
.rival .rec{font:600 15px var(--f-hud);white-space:nowrap}
.rivcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rivgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px}
.hits{margin-top:8px;display:grid;gap:2px;max-height:320px;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.7);z-index:40;display:grid;place-items:start center;padding:12vh 16px 16px}
.dlg{width:min(460px,100%);padding:16px;background:var(--solid);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center}
.slot{padding:20px;display:grid;justify-items:center;gap:10px;text-align:center;min-height:250px;align-content:center}
.slot h2{font:700 22px var(--f-body)}
.mebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-top:14px;border-color:rgba(255,122,138,.35)}
.mebar > span{flex:1;min-width:200px}
.fbar{display:block;position:relative;height:3px;border-radius:2px;background:var(--line);margin-top:6px;max-width:260px}
.fbar i{position:absolute;top:-3px;width:3px;height:9px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.wrow.cl{grid-template-columns:16px minmax(0,1.4fr) minmax(0,1fr) 84px 76px 70px;padding:4px 10px;font-size:13.5px}
.wrow.cl .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.cl .mk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.wrow.cl .r{text-align:right}
.vrow2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:4px;align-items:stretch;margin-bottom:3px}
.vrow2 .side{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 12px;border-radius:9px;color:var(--dim)}
.vrow2 .side.r{justify-content:flex-start}
.vrow2 .side b{font:600 14.5px var(--f-hud)} .vrow2 .side small{color:var(--faint);font:500 11.5px var(--f-hud)}
.vrow2 .wa{background:rgba(255,122,138,.13);color:var(--text)} .vrow2 .wb{background:rgba(95,212,255,.12);color:var(--text)}
.vrow2 .mid{display:flex;gap:10px;align-items:center;justify-content:center;min-width:0;text-align:center}
.vrow2 .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .vrow2 .mid small{color:var(--faint);font:500 12px var(--f-hud)}
.vrow3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 150px;gap:10px;align-items:center;padding:7px 10px;border-radius:9px}
.vrow3:hover,.vrow4:hover,.vrow5:hover{background:var(--surface)}
.vrow3 .res{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px} .vrow3 .res b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow4{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,1fr) 96px;gap:14px;align-items:center;padding:7px 10px;border-radius:9px}
.flane{position:relative;height:18px;border-bottom:2px solid var(--line);margin:0 9px}
.flane .mb{position:absolute;bottom:-9px;width:16px;height:16px;transform:translateX(-50%)}
.vrow5{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 84px 84px 90px;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;font-size:13.5px}
.vrow5 > span:not(.t){text-align:right} .vrow5 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow5.hd{border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px}
.vrow5 .w{color:var(--text);font-weight:700}
.mechip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface2);border:1px solid rgba(255,122,138,.35);font:500 13px var(--f-hud)}
.mecard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;margin-top:14px}
.mecard .side{display:flex;align-items:center;gap:10px;min-width:0} .mecard .side.r{justify-content:flex-end;text-align:right}
.mecard .side span{display:grid;min-width:0} .mecard .mid{text-align:center}
.mestick{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:12px;border-radius:9px;background:var(--solid);border:1px solid rgba(255,122,138,.35);font-size:13.5px}
.mestick > span{flex:1;min-width:0}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px var(--f-hud);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--solid);position:sticky;top:0}
th button{letter-spacing:inherit;text-transform:inherit}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;white-space:nowrap}
td.t{white-space:normal;min-width:180px}
tr:hover td{background:rgba(255,255,255,.03)}
.src{font:600 10.5px var(--f-hud);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface2);color:var(--dim)}
.src.c{color:var(--accent)}
/* split */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.split.one{grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:14px}
.role{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:999px;font:600 11.5px var(--f-hud);letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--dim)}
.role.mk{background:rgba(95,212,255,.13);color:var(--author)}
.hbar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden} .hbar i{display:block;height:100%;background:var(--author)}
.empty{padding:22px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
/* ---- head to head ---- */
.vshead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;margin-block:10px 18px}
.vsside{display:flex;align-items:center;gap:12px;min-width:0}
.vsside.r{flex-direction:row-reverse;text-align:right}
.vsside h2{font:700 22px/1.15 var(--f-body);overflow:hidden;text-overflow:ellipsis}
.vsside small{color:var(--dim);font-size:12.5px}
.vs{font:400 18px var(--f-marquee);color:var(--faint)}
.score{display:flex;align-items:center;justify-content:center;gap:18px;font:400 64px/1 var(--f-marquee)}
.score .d{color:var(--faint);font-size:28px}
.ca{color:var(--a)} .cb{color:var(--b)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 104px 96px;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
.vrow:hover{background:var(--surface)}
.vrow .tm{font:500 14px var(--f-hud);text-align:center;font-variant-numeric:tabular-nums;color:var(--dim)}
.vrow .tm small{display:block;font-size:11px;color:var(--faint)}
.vrow .tm.w{color:var(--text);font-weight:700}
.dpill{justify-self:center;font:600 12px var(--f-hud);padding:3px 8px;border-radius:999px;white-space:nowrap}
.dpill.a{background:rgba(255,122,138,.14);color:var(--a)} .dpill.b{background:rgba(95,212,255,.13);color:var(--b)}
.tug{display:grid;gap:3px}
.tugrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,190px) minmax(0,1fr);align-items:center;gap:8px;font-size:12.5px}
.tugrow .l,.tugrow .rr{display:flex;align-items:center;gap:6px;height:18px}
.tugrow .l{justify-content:flex-end}
.tugrow .bar{height:12px;border-radius:3px}
.tugrow .nm{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.tugrow .v{font:500 11.5px var(--f-hud);color:var(--faint);white-space:nowrap}
.tape{display:grid;gap:4px}
.taperow{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,170px) minmax(0,1fr);align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2)}
.taperow .v{font:700 20px var(--f-hud);display:flex;align-items:center;gap:10px}
.taperow .v.l{justify-content:flex-end}
.taperow .v .tb{height:8px;border-radius:4px;opacity:.85}
.taperow .k{text-align:center}
.taperow .v.lose{color:var(--faint)}
.scatter svg{width:100%;height:auto;display:block}
.duels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.duel{padding:10px 12px;display:grid;gap:8px}
.duel .hd{display:flex;gap:10px;align-items:center;min-width:0}
.duel .hd .sw{width:46px;height:30px}
.duel .hd div{min-width:0} .duel .hd b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane{position:relative;height:34px;border-radius:17px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px),var(--solid);border:1px solid var(--line2)}

.lane .flag{position:absolute;left:8px;top:0;bottom:0;border-left:2px dashed var(--gold);opacity:.7}
.duel .res{display:flex;justify-content:space-between;font:500 12.5px var(--f-hud);color:var(--dim)}

  .vsside h2{font-size:17px}
}

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const T = 100000;                     /* score ticks per second */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN = n => Number(n).toLocaleString("en-US");
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const sup = n => `${n}<sup>${ord(n).slice(-2)}</sup>`;
function fmtT(t){ const s = t / T, m = Math.floor(s / 60); return m + ":" + (s - m*60).toFixed(3).padStart(6, "0"); }
function gapT(t){ const s = t / T; return "+" + (s < 60 ? s.toFixed(3) : fmtT(t)); }
function hashN(str, mod){ let h = 7; for(const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 100003; return h % mod; }
const marble = (id, size) => `<span class="mb" style="--h:${hashN(id,360)};width:${size}px;height:${size}px"></span>`;
const swatch = (pf, css="") => `<span class="sw" style="${css}--h1:${hashN(pf,360)};--h2:${hashN(pf+"x",360)};--ang:${hashN(pf,4)*45}deg"></span>`;
const TIERS = ["wr","author","gold","silver","bronze","none"];
const TIER_LABEL = {wr:"World record", author:"Author", gold:"Gold", silver:"Silver", bronze:"Bronze", none:"No medal"};
function tierOf(md, score){ const s = score / T;
  return s <= md[3] ? "author" : s <= md[2] ? "gold" : s <= md[1] ? "silver" : s <= md[0] ? "bronze" : "none"; }
const pct = (rank, field) => { const x = rank / field * 100; return "top " + (x < 1 ? Math.max(.1, Math.round(x*10)/10).toFixed(1) : Math.ceil(x)) + "%"; };

/* ---------- derived records ---------- */
const PEOPLE = ["grinder","maker","regular","casual","wsonly","circonly"];
const PEOPLE_LABEL = {grinder:"Grinder · 838 maps", maker:"Map maker · 82 made", regular:"Regular · 45 maps", casual:"Casual · 3 maps", wsonly:"Workshop only", circonly:"Circuit only"};
function wsRuns(p){
  return p.runs.map(([pf, rank, score]) => { const m = D.maps[pf];
    return {pf, title:m[0], creator:m[1], rank, field:m[3], score, wr:m[6], gap:score - m[6], tier:rank===1 ? "wr" : tierOf(m[2], score),
            created:m[7], holder:m[5], author:m[2][3]}; });
}
function made(p){
  return p.authored.map(pf => { const m = D.maps[pf];
    return {pf, title:m[0], entries:m[3], subs:m[4], holder:m[5], wr:m[6], author:m[2][3], created:m[7], beaten:m[8], holderId:m[9]}; })
    .sort((a,b) => b.entries - a.entries);
}
function circuit(p){
  if(!p.circuit) return null;
  const seasons = [], all = p.circuit.find(r => r[0] === "All Seasons");
  for(const r of p.circuit){ if(r[0] === "All Seasons") continue;
    let s = seasons.find(x => x.group === r[0]); if(!s) seasons.push(s = {group:r[0], overall:null, tracks:[]});
    if(r[1] === "Overall") s.overall = {rank:r[2], field:r[3], pts:r[4]};
    else s.tracks.push({name:r[1], rank:r[2], field:r[3], score:r[4], lead:r[5]}); }
  const tr = seasons.flatMap(s => s.tracks);
  return {seasons, all: all ? {rank:all[2], pts:all[4]} : null, wr: tr.filter(t => t.rank===1).length,
          pod: tr.filter(t => t.rank<=3).length, run: tr.length};
}
function wsStats(runs){
  const t = Object.fromEntries(TIERS.map(k => [k, 0])); for(const r of runs) t[r.tier]++;
  return {n: runs.length, wr: runs.filter(r => r.rank===1).length, pod: runs.filter(r => r.rank<=3).length,
          near: runs.filter(r => r.rank>1 && r.gap <= T).length, tiers:t};
}
function person(key){ const p = D.players[key]; key = p.id;
  const runs = wsRuns(p); return {key, p, id:p.id, name:p.name, runs, st: wsStats(runs), made: made(p), c: circuit(p)}; }

/* ---------- shared markup ---------- */
function header(P, extra=""){
  const line = P.c && P.c.all ? `<b>${ord(P.c.all.rank)}</b> across all seasons &middot; ${fmtN(P.c.all.pts)} pts`
    : P.c ? "Not on the all-seasons board" : "No Circuit times";
  return `<a class="back" href="#">&larr; All leaderboards</a>
  <div class="pid">${marble(P.id, 60)}<span class="pwho"><h1>${esc(P.name)}</h1><span class="pline">${line}</span>${extra}</span>
    <a class="btn" href="#" onclick="event.preventDefault();pickVs('${P.id}')">⚔ Compare</a>
    <a class="steam" href="#">Steam profile</a></div>`;
}
function circuitStats(c){
  if(!c) return "";
  return `<dl class="stats">
    <div class="panel stat"><dt class="lab">World records</dt><dd>${c.wr}<small>on the Circuit</small></dd></div>
    <div class="panel stat"><dt class="lab">Podiums</dt><dd>${c.pod}<small>top three finishes</small></dd></div>
    <div class="panel stat"><dt class="lab">Tracks run</dt><dd>${c.run}<small>of 32 on the Circuit</small></dd></div>
    <div class="panel stat"><dt class="lab">All seasons</dt><dd>${c.all ? ord(c.all.rank) : "&mdash;"}<small>${c.all ? fmtN(c.all.pts)+" points" : "no season points"}</small></dd></div></dl>`;
}
function circuitBlock(c, compact){
  if(!c) return `<div class="panel empty"><b>No Circuit times</b>This player has only raced Workshop maps.</div>`;
  return c.seasons.map(s => `<section class="panel season"><div class="sh"><b>${esc(s.group)}</b>
      <span class="muted">${s.overall ? `<b class="num">${ord(s.overall.rank)}</b> overall &middot; ${fmtN(s.overall.pts)} pts` : "not ranked overall"}</span></div>
    <div class="ctiles">${s.tracks.map(t => `<span class="ctile" data-m="${t.rank<=3?t.rank:0}"><span class="n">${esc(t.name)}</span>
      <span class="r">${sup(t.rank)}<small>/${fmtN(t.field)}</small></span>${compact ? "" : `<span class="n">${fmtT(t.score)}</span>`}</span>`).join("")}</div></section>`).join("");
}
function wrow(r){
  return `<a class="wrow" href="#">${swatch(r.pf)}<span class="wt"><b>${esc(r.title)}</b><small>by ${esc(r.creator)} &middot; ${pct(r.rank, r.field)}</small></span>
    <span class="wrk" data-m="${r.rank<=3?r.rank:0}">${sup(r.rank)}<small>/${fmtN(r.field)}</small></span>
    <span class="wtm">${fmtT(r.score)}<small>${r.rank===1 ? "record" : gapT(r.gap)}</small></span>
    <span class="pip t-${r.tier}" title="${TIER_LABEL[r.tier]} medal"></span></a>`;
}
function mcard(m){
  return `<a class="panel mcard" href="#">${swatch(m.pf)}<span class="body"><b>${esc(m.title)}</b>
    <span class="muted num">${fmtN(m.entries)} runs &middot; ${fmtN(m.subs)} subscribers</span>
    <span class="faint">${m.wr ? `Record ${fmtT(m.wr)} by ${esc(m.holder)}` : "No times yet"}</span>
    <span class="faint">Author ${m.author.toFixed(3)}s &middot; beaten by ${fmtN(m.beaten)}</span></span></a>`;
}
function tierBar(t, n){
  return `<div class="mbar">${TIERS.slice(0,4).map(k => `<i class="t-${k}" style="width:${t[k]/Math.max(n,1)*100}%"></i>`).join("")}</div>`;
}
const SORTS = {
  best: ["Best placing", (a,b) => a.rank/a.field - b.rank/b.field],
  close: ["Closest to the record", (a,b) => (a.rank===1)-(b.rank===1) || a.gap/a.wr - b.gap/b.wr],
  big: ["Biggest boards", (a,b) => b.field - a.field],
  newest: ["Newest maps", (a,b) => b.created - a.created],
  az: ["A to Z", (a,b) => a.title.localeCompare(b.title)],
};
const FILTERS = {
  all: ["All", r => true], wr: ["Records", r => r.rank===1], pod: ["Podiums", r => r.rank<=3],
  author: ["Author medal", r => r.tier==="author"], near: ["Within a second", r => r.rank>1 && r.gap<=T],
};
function wsControls(P){
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div class="chips">${Object.entries(FILTERS).map(([k,[l,f]]) => `<button class="chip" aria-pressed="${ui.filter===k}" onclick="setUi({filter:'${k}',shown:40})">${l}<small>${P.runs.filter(f).length}</small></button>`).join("")}</div>
    <select class="sel" id="sortsel" onchange="setUi({sort:this.value})">${Object.entries(SORTS).map(([k,[l]]) => `<option value="${k}" ${ui.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
}
function wsList(P){
  const rows = P.runs.filter(FILTERS[ui.filter][1]).sort(SORTS[ui.sort][1]);
  if(!P.runs.length) return `<div class="panel empty"><b>No Workshop times yet</b></div>`;
  return `<div class="wlist">${rows.slice(0, ui.shown).map(wrow).join("")}</div>
    ${rows.length > ui.shown ? `<button class="btn more" onclick="setUi({shown:ui.shown+40})">Show 40 more <span class="faint">of ${fmtN(rows.length - ui.shown)}</span></button>` : ""}`;
}

/* ---------- PROFILE DESIGNS ---------- */
/* ---------- round 4: settled profile shell (Tabs, trophy shelf, two shelves); five map lists ---------- */
const noWs = `<div class="panel empty"><b>No Workshop times yet</b>Maps they finish will show up here.</div>`;
const recLine = P => `<p class="muted" style="margin:0 0 4px">${fmtN(P.st.n)} of 925 maps finished &middot; ${P.st.pod} podiums &middot; ${P.st.near} within a second of a record</p>`;
function shelf(title, rows, fmt){
  return rows.length ? `<div class="sec" style="margin-block:18px"><div class="sechead"><h3 class="lab">${title}</h3></div>
    <div class="shelf">${rows.map(r => `<a class="panel scard" href="#"><span class="top">${swatch(r.pf)}<div><b>${esc(r.title)}</b><span class="faint">by ${esc(r.creator)}</span></div></span>${fmt(r)}</a>`).join("")}</div></div>` : "";
}
function shelves(P){
  const recs = P.runs.filter(r => r.rank===1).sort((a,b) => b.field - a.field);
  return shelf(`World records <span class="faint">${recs.length}</span>`, recs.slice(0,14), r => `<span class="num"><b class="c-wr">1st</b> of ${fmtN(r.field)} &middot; ${fmtT(r.score)}</span>`)
    + shelf("Closest to a record", P.runs.filter(r => r.rank>1).sort((a,b) => a.gap - b.gap).slice(0,14), r => `<span class="big">${gapT(r.gap)}</span><span class="faint num">${ord(r.rank)} of ${fmtN(r.field)}, record by ${esc(r.holder)}</span>`);
}
const cnt = (P, k) => P.st.tiers[k];
const medalIcon = (k, size = 44, mini) => `<span class="medal ${k==="wr"?"wr":k==="none"?"none":"t-"+k}${mini?" mini":""}" style="--s:${size}px" title="${TIER_LABEL[k]}">${k==="wr"?"<b>1</b>":""}</span>`;
const trophies = P => `<div class="panel trophies" style="margin-bottom:14px">${TIERS.map(k => `<button onclick="pickTier('${k}')" style="${ui.tier===k?"border-color:var(--text);background:var(--surface2)":""}" ${cnt(P,k)?"":"data-zero"}>${medalIcon(k)}
      <b class="num c-${k}">${fmtN(cnt(P,k))}</b><span class="lab">${TIER_LABEL[k]}</span></button>`).join("")}</div>`;
function pickTier(k){ ui.tier = ui.tier===k ? null : k; ui.shown = 40; draw(); if(ui.tier) document.getElementById("alllist")?.scrollIntoView({behavior:"smooth", block:"start"}); }
function madeSec(P, limit = 12){
  const tot = P.made.reduce((s,m) => s + m.entries, 0), subs = P.made.reduce((s,m) => s + m.subs, 0), own = P.made.filter(m => m.holderId===P.id).length;
  const lim = ui.allMade ? 999 : limit;
  return `<p class="muted" style="margin:0 0 12px">${P.made.length} maps &middot; ${fmtN(tot)} runs on them &middot; ${fmtN(subs)} subscribers &middot; still holds the record on ${own}</p>
    <div class="cards">${P.made.slice(0, lim).map(mcard).join("")}</div>
    ${P.made.length > lim ? `<button class="btn more" onclick="setUi({allMade:true})">All ${P.made.length} maps</button>` : ""}`;
}
function tabBar(tabs){
  if(!tabs.find(t => t[0]===ui.tab)) ui.tab = (tabs.find(t => t[0]==="workshop" && t[2]) || tabs[0])[0];
  return `<div class="tabs" role="tablist">${tabs.map(([k,l,n]) => `<button role="tab" aria-selected="${ui.tab===k}" onclick="setUi({tab:'${k}',tier:null})">${l}<small>${fmtN(n)}</small></button>`).join("")}</div>`;
}
const makerBadge = P => P.made.length ? `<div style="margin-top:6px"><span class="role mk">Map maker &middot; ${P.made.length} maps</span></div>` : "";
/* the list's rows, after search, medal and sort */
const LSORTS = {
  best: ["Best placing", (a,b) => a.rank/a.field - b.rank/b.field],
  close: ["Closest to the record", (a,b) => (a.rank===1)-(b.rank===1) || a.gap/a.wr - b.gap/b.wr],
  big: ["Most runs", (a,b) => b.field - a.field],
  newest: ["Newest maps", (a,b) => b.created - a.created],
  az: ["A to Z", (a,b) => a.title.localeCompare(b.title)],
};
function listRows(P){
  const q = (ui.q || "").toLowerCase();
  return P.runs.filter(r => (!ui.tier || r.tier===ui.tier) && (!q || (r.title + " " + r.creator).toLowerCase().includes(q))).sort((LSORTS[ui.sort] || LSORTS.best)[1]);
}
function listHead(P, rows, noSort){
  return `<div id="alllist" class="sechead" style="margin-top:22px;scroll-margin-top:12px"><h2>All ${fmtN(P.st.n)} maps</h2></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <input class="search" id="q" placeholder="Search maps or makers" value="${esc(ui.q||"")}" oninput="ui.q=this.value;ui.shown=40;draw(true)">
      ${noSort ? "" : `<select class="sel" onchange="setUi({sort:this.value})">${Object.entries(LSORTS).map(([k,[l]]) => `<option value="${k}" ${ui.sort===k?"selected":""}>${l}</option>`).join("")}</select>`}
      ${ui.tier ? `<button class="chip" aria-pressed="true" onclick="pickTier(null)">${TIER_LABEL[ui.tier]} only ✕</button>` : ""}
      <span class="faint num">${fmtN(rows.length)} maps</span></div>`;
}
const moreBtn = (n, step = 40) => n > ui.shown ? `<button class="btn more" onclick="setUi({shown:ui.shown+${step}})">Show ${step} more <span class="faint">of ${fmtN(n - ui.shown)}</span></button>` : "";
function row4(r){
  return `<a class="wrow" href="#">${swatch(r.pf)}<span class="wt"><b>${esc(r.title)}</b><small>by ${esc(r.creator)} &middot; ${pct(r.rank, r.field)}</small></span>
    <span class="wrk" data-m="${r.rank<=3?r.rank:0}">${sup(r.rank)}<small>/${fmtN(r.field)}</small></span>
    <span class="wtm">${fmtT(r.score)}<small>${r.rank===1 ? "record" : gapT(r.gap)}</small></span>
    ${medalIcon(r.tier, 18, true)}</a>`;
}
function page(P, list){
  const t = tabBar([["circuit","Circuit", P.c ? P.c.run : 0], ["workshop","Workshop", P.st.n], ...(P.made.length ? [["made","Made", P.made.length]] : [])]);
  const body = ui.tab==="circuit" ? circuitStats(P.c) + circuitBlock(P.c) : ui.tab==="made" ? madeSec(P)
    : !P.runs.length ? noWs : trophies(P) + recLine(P) + shelves(P) + list(P);
  return header(P, makerBadge(P) + (hdrExtra ? hdrExtra(P) : "")) + (flowExtra ? flowExtra(P) : "") + t + body;
}
let flowExtra = null;   /* set by a head-to-head entry design to put something under the profile header */

const LISTS = [

        ${g.length > lim ? `<button class="btn more" onclick="setUi({open:'${k}'})">All ${fmtN(g.length)} ${TIER_LABEL[k].toLowerCase()}</button>` : ""}</section>`; }).join(""); } },

const PROFILE = LISTS.map(l => ({name: l.name, desc: l.desc, render: P => page(P, l.render)}));

/* ---------- HEAD TO HEAD: the settled page (Scoreboard + tape band) ---------- */
function commons(A, B, scope){
  const out = [];
  if(scope !== "c"){ const bm = new Map(B.runs.map(r => [r.pf, r]));
    for(const a of A.runs){ const b = bm.get(a.pf); if(!b) continue;
      out.push({kind:"w", key:a.pf, title:a.title, sub:"by " + a.creator, field:a.field, wr:a.wr, holder:a.holder, a, b}); } }
  if(scope !== "w" && A.c && B.c){ const bm = new Map(B.c.seasons.flatMap(s => s.tracks.map(t => [s.group+t.name, t])));
    for(const s of A.c.seasons) for(const a of s.tracks){ const b = bm.get(s.group+a.name); if(!b) continue;
      out.push({kind:"c", key:s.group+a.name, title:(s.group==="Season 1"?"S1 ":"S2 ")+a.name, sub:"Circuit, " + s.group, field:a.field, wr:a.lead, a, b}); } }
  for(const x of out){ x.d = x.a.score - x.b.score; x.win = x.d < 0 ? "a" : x.d > 0 ? "b" : "t"; x.rel = Math.abs(x.d) / Math.min(x.a.score, x.b.score); }
  return out;
}
const tally = (A, B) => { const xs = commons(A, B, "all"); return {n: xs.length, a: xs.filter(x => x.win==="a").length, b: xs.filter(x => x.win==="b").length}; };
function vrow(x){
  return `<div class="vrow"><span class="wt" style="display:flex;gap:10px;align-items:center;min-width:0">${x.kind==="w"?swatch(x.key,"width:40px;height:26px;"):`<span class="src c">Circuit</span>`}<span style="min-width:0"><b>${esc(x.title)}</b><small>${esc(x.sub)} &middot; ${fmtN(x.field)} runs</small></span></span>
    <span class="tm ${x.win==="a"?"w":""}">${fmtT(x.a.score)}<small>${ord(x.a.rank)}</small></span>
    <span class="dp dpill ${x.win}">${x.win==="t" ? "tie" : (x.win==="a"?"◀ ":"") + (Math.abs(x.d)/T).toFixed(3) + "s" + (x.win==="b"?" ▶":"")}</span>
    <span class="tm ${x.win==="b"?"w":""}">${fmtT(x.b.score)}<small>${ord(x.b.rank)}</small></span></div>`;
}
/* the current season is the newest group on the Circuit */
const CUR_SEASON = [...new Set(Object.values(D.players).flatMap(p => (p.circuit || []).map(r => r[0])))].filter(g => g !== "All Seasons").sort().pop();
const seasonRank = X => X.c?.seasons.find(s => s.group===CUR_SEASON)?.overall?.rank;
function vsPage(A, B, head){
  const xs = commons(A, B, ui.scope), aw = xs.filter(x => x.win==="a").length, bw = xs.filter(x => x.win==="b").length;
  const F = {all:["All",()=>1], a:[A.name+" faster",x=>x.win==="a"], b:[B.name+" faster",x=>x.win==="b"]};
  const S = {close:["Closest first",(p,q)=>p.rel-q.rel], big:["Biggest margins",(p,q)=>q.rel-p.rel], field:["Most runs",(p,q)=>q.field-p.field]};
  const f = F[ui.filter] ? ui.filter : "all", s = S[ui.sort] ? ui.sort : "close";
  const rows = xs.filter(F[f][1]).sort(S[s][1]);
  const side = (P, r) => `<div class="vsside ${r}">${marble(P.id,54)}<div style="min-width:0"><button onclick="openProfile('${P.id}')" style="text-align:inherit"><h2 class="${r?"cb":"ca"}">${esc(P.name)}</h2></button><br><button class="faint" style="font-size:12.5px" onclick="flowChange('${r?"b":"a"}')">change</button></div></div>`;
  const tape = (k, av, bv, low, fmt = v => v==null ? "—" : fmtN(v)) => { const w = av==null||bv==null||av===bv ? "" : (low ? av<bv : av>bv) ? "a" : "b";
    return `<div class="taperow"><span class="v l ${w==="b"?"lose":""}"><span class="${w==="a"?"ca":""}">${fmt(av)}</span></span><span class="k lab">${k}</span><span class="v ${w==="a"?"lose":""}"><span class="${w==="b"?"cb":""}">${fmt(bv)}</span></span></div>`; };
  const wrs = P => (P.c ? P.c.wr : 0) + P.st.wr;
  return `<a class="back" href="#" onclick="event.preventDefault();flowBack()">&larr; ${esc(A.name)}</a>
    <div class="vshead">${side(A,"")}<div style="text-align:center"><div class="score"><span class="ca">${aw}</span><span class="d">–</span><span class="cb">${bw}</span></div><div class="lab" style="margin-top:6px">${xs.length} ${ui.scope==="c"?"tracks":"maps"} in common</div></div>${side(B,"r")}</div>
    <div class="panel" style="padding:2px 16px;margin-bottom:16px"><div class="tape">
      ${tape("All seasons", A.c?.all?.rank, B.c?.all?.rank, true, v => v==null ? "—" : ord(v))}
      ${tape(CUR_SEASON + " overall", seasonRank(A), seasonRank(B), true, v => v==null ? "—" : ord(v))}
      ${tape("World records", wrs(A), wrs(B))}
      ${tape("Workshop maps finished", A.st.n, B.st.n)}
      ${tape("Maps made", A.made.length, B.made.length)}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px">
      <div class="seg">${[["all","All"],["c","Circuit"],["w","Workshop"]].map(([k,l]) => `<button aria-pressed="${ui.scope===k}" onclick="setUi({scope:'${k}',shown:60})">${l}</button>`).join("")}</div>
      <div class="chips">${Object.entries(F).map(([k,[l]]) => `<button class="chip" aria-pressed="${f===k}" onclick="setUi({filter:'${k}'})">${esc(l)}</button>`).join("")}</div>
      <select class="sel" onchange="setUi({sort:this.value})">${Object.entries(S).map(([k,[l]]) => `<option value="${k}" ${s===k?"selected":""}>${l}</option>`).join("")}</select></div>`
    + (xs.length ? `<div class="panel" style="padding:6px">${head ? head(A, B) : ""}${rows.slice(0, ui.shown).map(x => vrowFn(x, A, B)).join("")}</div>${moreBtn(rows.length, 60)}`
      : `<div class="panel empty"><b>Nothing in common yet</b>${esc(A.name)} and ${esc(B.name)} have no times on the same ${ui.scope==="c"?"Circuit tracks":ui.scope==="w"?"Workshop maps":"maps"}.</div>`);
}

      <span class="dp dpill ${x.win}" style="justify-self:end">${x.win==="a"?"◀ ":""}${margin(x)}${x.win==="b"?" ▶":""}</span></div>`; } },
{ name:"Columns", desc:"A table: both ranks, both times, the margin. Most per screen; every number lined up.",
  head: (A, B) => `<div class="vrow5 hd lab"><span>Map</span><span class="ca">Rank</span><span class="cb">Rank</span><span class="ca">Time</span><span class="cb">Time</span><span>Margin</span></div>`,
  fn: (x) => `<div class="vrow5"><span class="t"><b>${esc(x.title)}</b> <small class="faint">${esc(x.sub)}</small></span>
    <span class="num ${x.win==="a"?"ca":""}">${ord(x.a.rank)}</span><span class="num ${x.win==="b"?"cb":""}">${ord(x.b.rank)}</span>
    <span class="num ${x.win==="a"?"w":"faint"}">${fmtT(x.a.score)}</span><span class="num ${x.win==="b"?"w":"faint"}">${fmtT(x.b.score)}</span>
    <span class="num ${x.win==="a"?"ca":x.win==="b"?"cb":""}">${x.win==="a"?"◀ ":""}${margin(x)}${x.win==="b"?" ▶":""}</span></div>` },
];

/* you vs them: me is fixed to Bill Lumbergh in this round */
const ME = () => P(D.subjects.bill);
const youLine = (me, P) => { const t = tally(me, P); return {t, txt: `<b class="ca num">${t.a}</b>–<b class="cb num">${t.b}</b>`}; };
const MEBARS = [
{ name:"Banner", desc:"As in round 4: a strip under the header with your record against them and a button to the head to head.",
  extra: (me, P) => { const {t, txt} = youLine(me, P);
    return `<div class="panel mebar">${marble(me.id, 28)}<span><b>You</b> vs ${esc(P.name)}: ${txt} <span class="faint">on ${fmtN(t.n)} shared maps</span></span><button class="btn acc">Head to head →</button></div>`; } },
{ name:"Header chip", desc:"A small chip in the header line, beside the name. Always there, takes no room, one tap to the head to head.",
  head: (me, P) => { const {t, txt} = youLine(me, P);
    return `<div style="margin-top:8px"><button class="mechip">${marble(me.id, 18)}<span>You ${txt}</span><span class="faint">on ${fmtN(t.n)}</span> →</button></div>`; } },
{ name:"Score card", desc:"A scoreboard card under the header: your marble, the big tally, theirs. The head-to-head page's tally in miniature.",
  extra: (me, P) => { const {t} = youLine(me, P);
    return `<div class="panel mecard"><div class="side">${marble(me.id, 36)}<span><b>You</b><small class="faint">${esc(me.name)}</small></span></div>
      <div class="mid"><div class="score" style="font-size:40px"><span class="ca">${t.a}</span><span class="d">–</span><span class="cb">${t.b}</span></div><small class="lab">${fmtN(t.n)} shared maps</small></div>
      <div class="side r"><span><b>${esc(P.name)}</b></span>${marble(P.id, 36)}</div><button class="btn acc">Head to head →</button></div>`; } },
{ name:"Sticky strip", desc:"A thin strip that stays pinned to the top as you scroll their maps, so your record is always in view.",
  extra: (me, P) => { const {t, txt} = youLine(me, P);
    return `<div class="mestick">${marble(me.id, 18)}<span>You vs ${esc(P.name)} ${txt} <span class="faint">(${fmtN(t.n)} shared)</span></span><button class="lab">Head to head →</button></div>`; } },
{ name:"You in every row", desc:"The header chip, plus every map in their list shows your time against theirs. Their profile becomes your checklist of maps to beat them on.",
  head: (me, P) => MEBARS[1].head(me, P),
  row: me => { const mine = new Map(me.runs.map(r => [r.pf, r]));
    return r => { const y = mine.get(r.pf), d = y && y.score - r.score;
      return `<a class="wrow" href="#" style="grid-template-columns:44px minmax(0,1fr) 88px 104px 104px 20px">${swatch(r.pf)}<span class="wt"><b>${esc(r.title)}</b><small>by ${esc(r.creator)}</small></span>
        <span class="wrk" data-m="${r.rank<=3?r.rank:0}">${sup(r.rank)}<small>/${fmtN(r.field)}</small></span>
        <span class="wtm">${fmtT(r.score)}<small>${r.rank===1 ? "record" : gapT(r.gap)}</small></span>
        <span class="wtm">${y ? `<span class="${d<0?"ca":"cb"}">${d<0?"you −":"you +"}${(Math.abs(d)/T).toFixed(3)}</span><small>you ${ord(y.rank)}</small>` : `<span class="faint">you: no time</span>`}</span>
        ${medalIcon(r.tier, 18, true)}</a>`; }; } },
];

/* ---------- round 6: every settled choice, wired together ---------- */
const listRender = P => { const rows = listRows(P); return listHead(P, rows) + `<div class="wlist">${rows.slice(0, ui.shown).map(r => rowFn(r)).join("")}</div>` + moreBtn(rows.length); };
const SEARCHABLE = () => Object.keys(D.players).map(P).sort((a,b) => a.name.localeCompare(b.name));
const rivalsOf = A => D.rivals[A.id] || {common:[], close:[]};
function rivalRows(A, list, limit, pick){
  return list.slice(0, limit).map(([id, n, aw, bw]) => { const B = P(id);
    return `<button class="rival" onclick="${pick}('${id}')">${marble(id, 26)}<span class="rn"><b>${esc(B.name)}</b><small>${fmtN(n)} in common</small></span>
      <span class="rec num"><b class="ca">${aw}</b>–<b class="cb">${bw}</b></span></button>`; }).join("");
}
function searchBox(A, pick){
  const q = (ui.sq || "").toLowerCase();
  const hits = q ? SEARCHABLE().filter(B => B.id !== A.id && B.name.toLowerCase().includes(q)).slice(0, 8) : [];
  return `<input class="search" style="width:100%" id="sq" placeholder="Type a player's name" value="${esc(ui.sq||"")}" oninput="ui.sq=this.value;draw(true)" autocomplete="off">
    ${q ? `<div class="hits">${hits.length ? hits.map(B => { const t = tally(A, B);
      return `<button class="rival" onclick="${pick}('${B.id}')">${marble(B.id, 24)}<span class="rn"><b>${esc(B.name)}</b><small>${fmtN(t.n)} in common</small></span>${t.n ? `<span class="rec num"><b class="ca">${t.a}</b>–<b class="cb">${t.b}</b></span>` : ""}</button>`; }).join("")
      : `<p class="faint" style="margin:8px 4px">No player by that name. The mock only knows the ${Object.keys(D.players).length} players loaded here.</p>`}</div>` : ""}`;
}
function compareDialog(){
  const A = P(ui.dlgFor), R = rivalsOf(A), pick = "dlgPick";
  const sugg = R.common.length ? `<div class="lab" style="margin-bottom:6px">Closest matchups</div>${R.close.length ? rivalRows(A, R.close, 4, pick) : `<p class="faint">Nobody with 15+ maps in common yet.</p>`}
      <div class="lab" style="margin:12px 0 6px">Most in common</div>${rivalRows(A, R.common, 3, pick)}` : `<p class="faint">No suggestions: nobody shares many maps with ${esc(A.name)} yet.</p>`;
  return `<div class="scrim" onclick="if(event.target===this)setUi({modal:false,sq:''})"><div class="panel dlg" role="dialog" aria-label="Compare">
    <div class="sechead"><h2>Compare ${esc(A.name)} with…</h2><button class="faint" onclick="setUi({modal:false,sq:''})">✕</button></div>
    ${searchBox(A, pick)}${ui.sq ? "" : `<div style="margin-top:14px">${sugg}</div>`}</div></div>`;
}
function dlgPick(id){ const keep = ui.dlgFor; ui.change === "a" ? openVs(id, st.b) : openVs(keep, id); }
function pickVs(id){ setUi({modal:true, sq:"", dlgFor:id, change:null}); }
function flowBack(){ openProfile(st.a); }
function flowChange(side){ setUi({modal:true, sq:"", dlgFor: side==="a" ? st.b : st.a, change: side}); }
function openVs(a, b){ Object.assign(st, {view:"vs", a, b}); resetUi(); draw(); scrollTo({top:0}); }
function openProfile(id){ Object.assign(st, {view:"profile", who:id}); resetUi(); draw(); scrollTo({top:0}); }
function meCard(me, X){ const t = tally(me, X);
  return `<div class="panel mecard"><div class="side">${marble(me.id, 36)}<span><b>You</b><small class="faint">${esc(me.name)}</small></span></div>
    <div class="mid"><div class="score" style="font-size:40px"><span class="ca">${t.a}</span><span class="d">–</span><span class="cb">${t.b}</span></div><small class="lab">${fmtN(t.n)} shared maps</small></div>
    <div class="side r"><span><b>${esc(X.name)}</b></span>${marble(X.id, 36)}</div><button class="btn acc" onclick="openVs('${me.id}','${X.id}')">Head to head →</button></div>`;
}

let st = {view:"profile", who:D.subjects.grinder, a:null, b:null, me:null};
let ui;
function resetUi(){ ui = {tab:null, tier:null, open:null, allMade:false, sort: st.view==="vs" ? "close" : "best", shown: st.view==="vs" ? 60 : 40, q:"", sq:"", scope:"all", filter:"all", modal:false, dlgFor:null, change:null}; }
try { const s = JSON.parse(localStorage.getItem("ballest-proto6") || "null"); if(s && s.view) st = s; } catch(e){}
if(!D.players[st.who]) st.who = D.subjects.grinder;
if(st.view==="vs" && !(D.players[st.a] && D.players[st.b])) st.view = "profile";
resetUi();
function P(k){ const id = D.subjects[k] || k; return cache[id] || (cache[id] = person(id)); }
function setUi(o){ Object.assign(ui, o); draw(); }
function draw(keepFocus){
  try { localStorage.setItem("ballest-proto6", JSON.stringify(st)); } catch(e){}
  const focus = keepFocus && document.activeElement && document.activeElement.id, pos = focus && document.activeElement.selectionStart;
  flowExtra = null; hdrExtra = null; rowFn = ROWS[2].fn; vrowFn = MATCH[1].fn;
  const me = st.me && D.players[st.me] ? P(st.me) : null;
  let html;
  if(st.view==="vs") html = vsPage(P(st.a), P(st.b));
  else { const X = P(st.who);
    hdrExtra = () => `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${me && me.id===X.id ? `<span class="role mk">This is you</span><button class="faint" style="font-size:12.5px" onclick="st.me=null;draw()">undo</button>`
      : me ? "" : `<button class="chip" onclick="st.me='${X.id}';draw()">This is me</button>`}</div>`;
    if(me && me.id !== X.id) flowExtra = () => meCard(me, X);
    html = page(X, listRender); }
  $("#app").innerHTML = html + (ui.modal ? compareDialog() : "");
  if(focus){ const el = document.getElementById(focus); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  else if(ui.modal){ document.getElementById("sq")?.focus(); }
  $("#qs").innerHTML = ""; $("#qs").hidden = true; $("#prev").hidden = true; $("#next").hidden = true;
  $("#dname").textContent = "Everything settled"; $("#dnum").textContent = st.view==="vs" ? "Head to head" : "Profile";
  $("#ddesc").textContent = "Click through it like the real site: Compare, the rivals, This is me, the trophy shelf, the Made tab.";
  $("#stlab").textContent = "Jump to a profile";
  $("#states").innerHTML = PEOPLE.concat(["pamzei","laney","bill"]).map(k => `<button aria-pressed="${st.view==="profile" && st.who===D.subjects[k]}" onclick="openProfile('${D.subjects[k]}')">${esc(P(k).name)}</button>`).join("")
    + `<button aria-pressed="${!!me}" onclick="st.me=st.me?null:'${D.subjects.bill}';draw()">${me ? "Me: " + esc(me.name) + " ✕" : "Set me = Bill Lumbergh"}</button>`;
}
addEventListener("keydown", e => { if(e.key==="Escape" && ui.modal) setUi({modal:false, sq:""}); });
$("#pkmin").onclick = () => $("#pk").classList.toggle("min");
(() => { const pk = $("#pk"), g = $("#grip"); let sx, sy, ox, oy;
  g.addEventListener("pointerdown", e => { if(e.target.tagName==="BUTTON") return; const r = pk.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top; g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e => { if(sx==null) return; pk.style.left = Math.max(0, Math.min(innerWidth-60, ox+e.clientX-sx))+"px"; pk.style.top = Math.max(0, Math.min(innerHeight-40, oy+e.clientY-sy))+"px"; pk.style.right="auto"; pk.style.bottom="auto"; });
  g.addEventListener("pointerup", () => sx = null); })();
draw();
</script>
